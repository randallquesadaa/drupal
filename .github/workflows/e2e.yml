name: E2E Tests

# CAMBIAR: por defecto solo corre en PR para ahorrar minutos. Agregá "push"
# si querés que corra también en cada commit a main.
on:
  pull_request:
    branches: [main, develop]

env:
  DRUPAL_ROOT: web        # CAMBIAR si tu docroot no es "web"
  PHP_VERSION: "8.5"       # CAMBIAR
  NODE_VERSION: "24"       # CAMBIAR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SIMPLETEST_DB: "mysql://drupal:drupal@127.0.0.1:3306/drupal"
      BASE_URL: "http://127.0.0.1:8080"   # CAMBIAR si tu Playwright config usa otro puerto
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2, drush
          extensions: mbstring, gd, pdo_mysql, zip

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Composer install
        run: composer install --no-progress --prefer-dist

      - name: Copiar settings.ci.php
        run: |
          if [ ! -f "${{ env.DRUPAL_ROOT }}/sites/default/settings.ci.php" ]; then
            cp docs/settings.ci.php.example "${{ env.DRUPAL_ROOT }}/sites/default/settings.ci.php"
          fi

      - name: Instalar el sitio
        run: |
          vendor/bin/drush site-install \
            --existing-config \
            --db-url="${{ env.SIMPLETEST_DB }}" \
            --account-name=admin \
            --account-pass=admin \
            -y

      - name: Levantar servidor
        run: |
          vendor/bin/drush runserver 127.0.0.1:8080 &
          sleep 5

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: tests/playwright/pnpm-lock.yaml

      - name: Instalar dependencias de Playwright
        working-directory: tests/playwright
        run: pnpm install --frozen-lockfile

      - name: Instalar navegadores de Playwright
        working-directory: tests/playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Correr tests E2E
        working-directory: tests/playwright
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: pnpm exec playwright test

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright/playwright-report/
          retention-days: 7
