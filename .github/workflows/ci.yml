name: CI

# CAMBIAR: ajustá las ramas según tu flujo de Git.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # CAMBIAR: ruta del docroot. Común: "web" (drupal/recommended-project),
  # "docroot" (Acquia/Pantheon), o "" si Drupal vive en la raíz del repo.
  DRUPAL_ROOT: web
  PHP_VERSION: "8.5"      # CAMBIAR si tu sitio requiere otra versión
  NODE_VERSION: "24"      # CAMBIAR si tu tema/módulos requieren otra versión

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ───────────────────────────── LINT ─────────────────────────────
  lint:
    name: Lint (PHPCS, PHPStan, ESLint, Stylelint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Composer install
        run: composer install --no-progress --prefer-dist

      - name: PHPCS (Drupal + DrupalPractice)
        run: |
          # CAMBIAR rutas dentro de phpcs.xml si tu código custom no está en
          # web/modules/custom o web/themes/custom
          vendor/bin/phpcs --standard=tests/config/phpcs.xml

      - name: PHPStan
        run: vendor/bin/phpstan analyse --configuration=tests/config/phpstan.neon

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Instalar dependencias JS
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: |
          pnpm exec eslint \
            --no-eslintrc --config .eslintrc.json \
            "${{ env.DRUPAL_ROOT }}/modules/custom/**/*.js" \
            "${{ env.DRUPAL_ROOT }}/themes/custom/**/*.js" \
            --no-error-on-unmatched-pattern

      - name: Stylelint
        run: pnpm exec stylelint "${{ env.DRUPAL_ROOT }}/themes/custom/**/*.{css,scss}" --allow-empty-input

  # ──────────────────────────── SEGURIDAD ─────────────────────────
  security:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Composer install
        run: composer install --no-progress --prefer-dist

      - name: Composer audit
        run: composer audit


  # ─────────────────── UNIT/KERNEL TESTS + BUILD ──────────────────
  build-and-test:
    name: Build sitio + Unit/Kernel tests
    runs-on: ubuntu-latest
    needs: security

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: drupal       # CAMBIAR si querés otro nombre
          MYSQL_USER: drupal           # CAMBIAR
          MYSQL_PASSWORD: drupal       # CAMBIAR
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      # ── Alternativa PostgreSQL (descomentar y borrar el bloque mysql) ──
      # postgres:
      #   image: postgres:15
      #   env:
      #     POSTGRES_DB: drupal
      #     POSTGRES_USER: drupal
      #     POSTGRES_PASSWORD: drupal
      #   ports:
      #     - 5432:5432
      #   options: >-
      #     --health-cmd pg_isready
      #     --health-interval 10s
      #     --health-timeout 5s
      #     --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: drupal
      DB_USER: drupal
      DB_PASS: drupal
      SIMPLETEST_DB: "mysql://drupal:drupal@127.0.0.1:3306/drupal"
      SIMPLETEST_BASE_URL: "http://127.0.0.1:8080"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2, drush
          extensions: mbstring, gd, pdo_mysql, zip, opcache
          coverage: xdebug

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Composer install
        run: composer install --no-progress --prefer-dist

      - name: Copiar settings.ci.php
        # CAMBIAR la ruta de origen/destino si tu docroot no es "web/"
        run: |
          if [ ! -f "${{ env.DRUPAL_ROOT }}/sites/default/settings.ci.php" ]; then
            cp docs/settings.ci.php.example "${{ env.DRUPAL_ROOT }}/sites/default/settings.ci.php"
            echo "⚠️ Usando el settings.ci.php de ejemplo. Reemplazalo por el tuyo si ya lo personalizaste."
          fi

      - name: Instalar el sitio
        run: |
          vendor/bin/drush site-install \
            --existing-config \
            --db-url="${{ env.SIMPLETEST_DB }}" \
            --account-name=admin \
            --account-pass=admin \
            -y

      - name: Levantar servidor de pruebas
        run: |
          vendor/bin/drush runserver 127.0.0.1:8080 &
          sleep 5

      - name: PHPUnit (custom modules)
        run: |
          vendor/bin/phpunit \
            --bootstrap="${{ env.DRUPAL_ROOT }}/core/tests/bootstrap.php" \
            --configuration="${{ env.DRUPAL_ROOT }}/core" \
            --coverage-clover=coverage.xml \
            "${{ env.DRUPAL_ROOT }}/modules/custom" \
            "${{ env.DRUPAL_ROOT }}/themes/custom"

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false  # CAMBIAR a true si querés que bloquee el merge

      - name: Guardar reporte de cobertura como artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
          if-no-files-found: ignore
