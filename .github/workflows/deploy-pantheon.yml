name: Deploy - Pantheon

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]   # CAMBIAR si tu rama principal tiene otro nombre
  workflow_dispatch:   # permite dispararlo manualmente desde GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy a Pantheon
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    env:
      TERMINUS_SITE: drupal-placeholder   # CAMBIAR: machine name de tu sitio en Pantheon

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"   # CAMBIAR si tu sitio usa otra versión
          tools: composer:v2

      - name: Composer install (sin dependencias de desarrollo)
        run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction

      - name: Configurar SSH para Pantheon
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PANTHEON_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Aceptar el host de Pantheon sin prompt interactivo
          ssh-keyscan -p 2222 -H codeserver.dev.${{ secrets.PANTHEON_SITE_UUID }}.drush.in \
            >> ~/.ssh/known_hosts 2>/dev/null || true
          # Evitar prompts de verificación para hosts de Pantheon
          cat >> ~/.ssh/config << 'EOF'
          Host *.drush.in
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Construir rama de deploy con todo el código
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b pantheon-deploy

          # Forzar inclusión de todo lo que .gitignore excluye pero
          # Pantheon necesita para correr el sitio sin composer install
          git add -f vendor/             2>/dev/null || true
          git add -f web/core/           2>/dev/null || true
          git add -f web/modules/contrib/ 2>/dev/null || true
          git add -f web/themes/contrib/  2>/dev/null || true
          git add -f web/profiles/contrib/ 2>/dev/null || true
          git add -f web/libraries/      2>/dev/null || true
          git add -f drush/contrib/      2>/dev/null || true

          # Agregar el resto de archivos rastreados normalmente
          git add -A

          # Eliminar archivos reservados por Pantheon que no deben tocarse
          git rm --cached web/core/pantheon.upstream.yml 2>/dev/null || true

          git commit -m "Build para Pantheon [skip ci]" \
            || echo "Sin cambios nuevos que commitear"

      - name: Push al repositorio de Pantheon (ambiente dev)
        run: |
          git remote add pantheon \
            ssh://codeserver.dev.${{ secrets.PANTHEON_SITE_UUID }}@codeserver.dev.${{ secrets.PANTHEON_SITE_UUID }}.drush.in:2222/~/repository.git
          git push pantheon pantheon-deploy:master --force

      - name: Instalar Terminus
        run: |
          TERMINUS_VERSION=$(curl -fsSL \
            "https://api.github.com/repos/pantheon-systems/terminus/releases/latest" \
            | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -fsSL \
            "https://github.com/pantheon-systems/terminus/releases/download/${TERMINUS_VERSION}/terminus.phar" \
            -o /usr/local/bin/terminus
          chmod +x /usr/local/bin/terminus
          terminus --version

      - name: Autenticar Terminus
        run: terminus auth:login --machine-token=${{ secrets.TERMINUS_TOKEN }}

      - name: Verificar bootstrap de Drupal
        run: terminus drush ${{ env.TERMINUS_SITE }}.dev -- status --fields=drupal-version,db-status,conf-dir -vvv

      - name: Tareas post-deploy en dev (updatedb, config-import, cache-rebuild)
        run: terminus drush ${{ env.TERMINUS_SITE }}.dev -- deploy -y -vvv

      - name: Promover dev -> test
        # Borrá este paso si preferís promover manualmente o no usás el ambiente test
        run: |
          terminus env:deploy ${{ env.TERMINUS_SITE }}.test \
            --note="Deploy desde GitHub Actions - ${{ github.sha }}" -y

      - name: Promover test -> live
        # Borrá este paso si preferís promover manualmente
        run: |
          terminus env:deploy ${{ env.TERMINUS_SITE }}.live \
            --note="Deploy desde GitHub Actions - ${{ github.sha }}" -y

      - name: Resultado del deploy
        if: always()
        run: echo "Deploy a Pantheon finalizado con status ${{ job.status }}"

# ═══════════════════════════════════════════════════════════════════════
# Secrets requeridos en GitHub (Settings -> Secrets -> Actions):
#
#   PANTHEON_SSH_KEY     Contenido completo de la llave privada SSH
#                        (la llave publica debe estar en Pantheon -> Account -> SSH Keys)
#   PANTHEON_SITE_UUID   UUID del sitio (Dashboard -> Connection Info)
#   TERMINUS_TOKEN       Machine Token (Pantheon -> Account -> Machine Tokens)
#
# Variable en este archivo:
#   TERMINUS_SITE        Machine name del sitio (terminus site:list para verlo)
#
# Requisitos en Pantheon:
#   1. Sitio en modo Git: Dashboard -> Dev -> Connection Mode -> Git
#   2. SSH Key registrada: Account -> SSH Keys
#   3. Machine Token creado: Account -> Machine Tokens
# ═══════════════════════════════════════════════════════════════════════
