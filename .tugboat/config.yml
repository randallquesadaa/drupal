services:

  php:
    image: tugboatqa/php:8.5-apache-bookworm
    default: true
    depends: mysql

    commands:

      # INIT: runs once when the preview is first created.
      init:
        - docker-php-ext-install opcache
        - a2enmod headers rewrite
        - ln -snf "${TUGBOAT_ROOT}/web" "${DOCROOT}"
        - ln -snf "${TUGBOAT_ROOT}/vendor/bin/drush" /usr/local/bin/drush
        - apt-get update -qq && apt-get install -y -qq default-mysql-client
        - |
          set -e
          if [ -f "${TUGBOAT_ROOT}/db.sql.gz" ]; then
            echo "Importing db.sql.gz"
            zcat "${TUGBOAT_ROOT}/db.sql.gz" | mysql -h mysql -u tugboat -ptugboat tugboat
          elif [ -f "${TUGBOAT_ROOT}/db.sql" ]; then
            echo "Importing db.sql"
            mysql -h mysql -u tugboat -ptugboat tugboat < "${TUGBOAT_ROOT}/db.sql"
          else
            echo "ERROR: db.sql.gz or db.sql not found in project root"
            exit 1
          fi

      # UPDATE: runs on every rebuild (new commit to the PR).
      update:
        - export COMPOSER_MEMORY_LIMIT=-1
        - composer install --optimize-autoloader --no-interaction

      # BUILD: runs after update. Applies DB updates and config on top of the imported backup.
      build:
        - cp "${TUGBOAT_ROOT}/.tugboat/settings.tugboat.php" "${DOCROOT}/sites/default/settings.tugboat.php"
        - |
          if ! grep -q "settings.tugboat.php" "${DOCROOT}/sites/default/settings.php"; then
            echo "if (getenv('TUGBOAT_PREVIEW_ID')) { include __DIR__ . '/settings.tugboat.php'; }" >> "${DOCROOT}/sites/default/settings.php"
          fi
        - mkdir -p "${DOCROOT}/sites/default/files/translations"
        - chgrp -R www-data "${DOCROOT}/sites/default/files"
        - find "${DOCROOT}/sites/default/files" -type d -exec chmod 2775 {} \;
        - find "${DOCROOT}/sites/default/files" -type f -exec chmod 0664 {} \;
        - drush updatedb --yes
        - drush config:import --yes || echo "No config to import or already in sync"
        - drush cache:rebuild
        - drush sqlsan --yes

      # ONLINE: runs after the preview is live and responding.
      online:
        - |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${TUGBOAT_DEFAULT_SERVICE_URL}")
          if [ "$STATUS" != "200" ]; then
            echo "Home returned $STATUS instead of 200"
            exit 1
          fi
        - cd "${TUGBOAT_ROOT}" && vendor/bin/phpunit --testsuite=unit,kernel --bootstrap="${DOCROOT}/core/tests/bootstrap.php" --configuration="${DOCROOT}/core" || echo "Tests failed - check preview log"

  mysql:
    image: tugboatqa/mariadb:11.8
