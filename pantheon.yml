api_version: 1

# Indica a Pantheon que el docroot es web/ y no la raiz del repo.
# Sin esto, Pantheon intenta servir desde la raiz y el sitio no funciona.
web_docroot: true

php_version: 8.3   # CAMBIAR: Pantheon soporta 8.1, 8.2, 8.3 (verificar soporte de 8.5 en tu plan)

drush_version: 13

# Desactivar Integrated Composer — nuestro CI envia vendor/ y web/core/
# ya compilados, Pantheon no necesita correr composer install.
build_step: false
